replicaCount: 1

image:
  repository: ghcr.io/dlunch/bot
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

env:
  maxThreadHistory: 20
  slackStreamUpdateMs: 800
  discordStreamUpdateMs: 800

auth:
  existingSecret: ""

  codex:
    refreshToken: ""
    refreshTokenFile: /app/data/codex-refresh-token

  anthropic:
    apiKey: ""

  persistence:
    existingClaim: ""
    accessMode: ReadWriteOnce
    size: 1Gi
    mountPath: /app/data

# providers: model-to-provider 매핑. rate limit 시 models 순서대로 fallback.
# services: 각 서비스 설정. models 배열의 순서가 fallback 우선순위.
#
# imageGeneration (optional, default false): Codex 백엔드의 image_generation
# 내장 툴을 해당 봇에서 활성화한다. Slack/Discord/CLI에서 사용 가능.
# - Boolean literal만 허용 (true/false). 문자열 "true"는 false로 처리됨 (strict 비교).
# - Anthropic provider 경로에서는 무시된다 (기동 시 warn 로그).
# - IRC는 이미지 첨부가 불가능하여 필드를 설정해도 동작에 영향이 없다 (inert).
#
# config:
#   providers:
#     codex:
#       models: ["gpt-5.3-codex"]
#     anthropic:
#       models: ["claude-sonnet-4-20250514"]
#   services:
#     slack:
#       - name: main
#         botToken: xoxb-...
#         appToken: xapp-...
#         models: ["gpt-5.3-codex", "claude-sonnet-4-20250514"]
#         webSearch: true
#         imageGeneration: false  # Codex image_generation 툴 활성화 여부 (Boolean literal만)
#     discord:
#       - name: main
#         botToken: "..."
#         models: ["claude-sonnet-4-20250514"]
#         imageGeneration: false
#     irc: []
config:
  servicesExistingSecret: ""

  providers:
    codex:
      models: []
    anthropic:
      models: []

  services:
    slack: []
    discord: []
    irc: []
