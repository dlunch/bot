{{- if not .Values.auth.existingSecret }}
{{- if ne (empty .Values.auth.codex.accessToken) (empty .Values.auth.codex.refreshToken) }}
{{- fail "auth.codex.accessToken and auth.codex.refreshToken must be set together when auth.existingSecret is empty" }}
{{- end }}
{{- if and (not .Values.auth.codex.accessToken) (not .Values.auth.anthropic.apiKey) }}
{{- fail "auth.codex access/refresh tokens or auth.anthropic.apiKey are required when auth.existingSecret is empty" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bot.authSecretName" . }}
  labels:
    {{- include "bot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.codex.accessToken }}
  CODEX_ACCESS_TOKEN: {{ .Values.auth.codex.accessToken | quote }}
  {{- end }}
  {{- if .Values.auth.codex.refreshToken }}
  CODEX_REFRESH_TOKEN: {{ .Values.auth.codex.refreshToken | quote }}
  {{- end }}
  {{- if .Values.auth.anthropic.apiKey }}
  ANTHROPIC_API_KEY: {{ .Values.auth.anthropic.apiKey | quote }}
  {{- end }}
{{- end }}
