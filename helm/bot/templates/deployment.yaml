{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1 because the bot and Codex auth bundle require a single writer" }}
{{- end }}
{{- if ne (default "" .Values.strategy.type) "Recreate" }}
{{- fail "strategy.type must be Recreate because rolling pods would overlap the singleton bot and Codex auth writer" }}
{{- end }}
{{- $authMountPath := trim (toString .Values.auth.persistence.mountPath) }}
{{- if or (empty $authMountPath) (not (isAbs $authMountPath)) }}
{{- fail "auth.persistence.mountPath must be a non-empty absolute path" }}
{{- end }}
{{- $authMountPath = clean $authMountPath }}
{{- $authFile := clean (printf "%s/codex-auth.json" $authMountPath) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bot.fullname" . }}
  labels:
    {{- include "bot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bot.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: CODEX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bot.authSecretName" . }}
                  key: CODEX_ACCESS_TOKEN
                  optional: true
            - name: CODEX_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bot.authSecretName" . }}
                  key: CODEX_REFRESH_TOKEN
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bot.authSecretName" . }}
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: CODEX_AUTH_FILE
              value: {{ $authFile | quote }}
            - name: MAX_CONTEXT_BYTES
              value: {{ .Values.env.maxContextBytes | quote }}
            - name: SLACK_STREAM_UPDATE_MS
              value: {{ .Values.env.slackStreamUpdateMs | quote }}
            - name: DISCORD_STREAM_UPDATE_MS
              value: {{ .Values.env.discordStreamUpdateMs | quote }}
          volumeMounts:
            - name: services-config
              mountPath: /app/config/services.json
              subPath: services.json
              readOnly: true
            - name: auth-state
              mountPath: {{ $authMountPath | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: services-config
          secret:
            secretName: {{ include "bot.servicesSecretName" . }}
        - name: auth-state
          persistentVolumeClaim:
            claimName: {{ include "bot.authPersistenceClaimName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
